[package]
name = "clayrs"
edition.workspace = true
version.workspace = true

[dependencies]
cmt2 = { path = "../../cmt2/core", version = "0.2.0" }
indexmap = "2.7.1"
lalrpop-util = "0.22.1"
log = "0.4.26"
logos = "0.15.0"
miette = "7.5.0"
proc-macro2 = { version = "1.0.92", features = [
    "span-locations",
    "proc-macro",
] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
slotmap = "1.0.7"
thiserror = "2.0.11"
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
paste = "1.0.15"
regex = "1.11.0"
good_lp = "1.14.0"

[build-dependencies]
lalrpop = "0.22.1"
